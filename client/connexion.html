<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Se connecter — Bana Frites</title>
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>

    <header class="header">
      <a href="/index.html">
        <img src="/src/assets/logo.png" alt="Bana Frites" class="header-logo" />
      </a>
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Ouvrir le menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <div class="nav-overlay" id="navOverlay"></div>

    <nav class="nav-panel" id="navPanel">
      <button class="nav-close-btn" id="navCloseBtn" aria-label="Fermer le menu">✕</button>
      <ul class="nav-links">
        <li><a href="/index.html">Accueil</a></li>
        <li><a href="#">Message anonyme</a></li>
        <li><a href="#">Matching</a></li>
        <li><a href="#">Jeu couple</a></li>
        <li><a href="/connexion.html">Connexion / Créer un compte</a></li>
      </ul>
    </nav>

    <div class="signup-page">
      <form class="signup-card" id="loginForm" novalidate>
        <h2 class="signup-title">Se connecter</h2>

        <p class="signup-global-error" id="globalError" role="alert" hidden></p>

        <div class="signup-field" style="animation-delay: 0.05s">
          <label for="email">Email</label>
          <input type="email" id="email" />
          <p class="field-error" id="errorEmail" hidden></p>
        </div>

        <div class="signup-field" style="animation-delay: 0.1s">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" />
          <p class="field-error" id="errorPassword" hidden></p>
        </div>

        <button type="submit" class="signup-submit-btn" id="submitBtn">
          Se connecter
        </button>

        <button type="button" class="google-btn" id="googleBtn">
          <span class="google-icon">G</span>
          Se connecter avec Google
        </button>

        <p class="signup-switch-link">
          Pas encore de compte ? <a href="/inscription.html">Créer un compte</a>
        </p>
      </form>
    </div>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/connexion.js"></script>
  </body>
</html>
