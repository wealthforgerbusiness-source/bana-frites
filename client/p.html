    <link rel="stylesheet" href="/css/style.css" />

  <body>

    <header class="header">
      <a href="/index.html">
        <img src="/src/assets/logo.png" alt="Bana Frites" class="header-logo" />

      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Ouvrir le menu">

        <div id="panelState" hidden>

          <p id="pDescription" class="p-description"></p>
